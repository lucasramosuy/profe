# Pages CMS (https://pagescms.org) - panel de edición de Profe.
media:
  input: docs/archivos
  output: /profe/archivos

content:
  - name: materiales
    label: Materiales
    type: file
    path: docs/materiales.json
    format: json
    fields:
      - name: materiales
        label: Materiales
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titulo}"
        fields:
          - name: titulo
            label: Título
            type: string
            required: true
          - name: curso
            label: Curso
            type: string
            required: true
          - name: descripcion
            label: Descripción
            type: string
          - name: archivo
            label: Archivo
            type: file
            required: true
          - name: fecha
            label: Fecha
            type: date
            options:
              format: yyyy-MM-dd
