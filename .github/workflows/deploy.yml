name: Publicar sitio

on:
  push:
    branches: [prod]
  # El workflow de videos commitea con GITHUB_TOKEN y eso no dispara "push": se publica de nuevo al terminar.
  workflow_run:
    workflows: ["Videos de YouTube"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 exige Node >=22.23.4; el alias "22" resolvía a 22.23.3 en el runner y rompía el build.
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
