name: PR de contenido del panel

# Pages CMS no puede forzar PR: escribe en la rama que se elige en su selector.
# Si en el panel se elige la rama `cms`, este workflow abre solo el PR cms -> prod
# para revisar y mergear. Si el PR ya existe, no hace nada.

on:
  push:
    branches: [cms]

permissions:
  contents: read
  pull-requests: write

jobs:
  abrir-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir PR si no existe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existente=$(gh pr list --head cms --base prod --state open --json number --jq '.[0].number')
          if [ -n "$existente" ]; then
            echo "Ya hay un PR abierto: #$existente"
            exit 0
          fi
          gh pr create --head cms --base prod \
            --title "Contenido desde el panel" \
            --body "Cambios guardados en Pages CMS sobre la rama cms. Revisar y mergear para publicar."
