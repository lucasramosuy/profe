name: Acciones de Pages CMS

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Contexto JSON de Pages CMS
        required: false
        default: '{}'
        type: string
  push:
    branches: [prod]
    paths: [docs/materiales.json]

permissions:
  contents: read

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar librería de imágenes
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install 'Pillow==11.3.0' 'reportlab==4.2.5' 'python-docx==1.2.0'
      - name: Ejecutar acción
        id: accion
        env:
          CMS_PAYLOAD: ${{ inputs.payload || '{}' }}
          EVENT_NAME: ${{ github.event_name }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/acciones_cms.py
      - name: Adjuntar imprimible
        if: steps.accion.outputs.pdf_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: imprimible-${{ github.run_number }}
          path: ${{ steps.accion.outputs.pdf_path }}
          if-no-files-found: error
          retention-days: 7
      - name: Abrir PR para imágenes optimizadas
        if: steps.accion.outputs.optimized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rama="cms/imagenes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$rama"
          git add docs/archivos
          git commit -m 'Optimizar imágenes de materiales sin alterar su contenido'
          git push origin "$rama"
          gh pr create --base prod --head "$rama" --title 'Optimizar imágenes de materiales' --body 'Optimización sin cambios visibles. Revisá los archivos y fusioná este PR para publicarlos.'
