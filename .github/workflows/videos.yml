name: Videos de YouTube

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [prod]
    paths: [docs/videos-destacados.json]

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
      - run: python3 scripts/videos_yt.py
      - name: Commit si cambió
        run: |
          git add docs/videos.json docs/videos
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Videos: actualizar desde YouTube"
            git pull --rebase origin prod
            git push origin prod
          fi
