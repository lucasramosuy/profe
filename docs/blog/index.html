<style>
:root{
  --paper:#f7f1e6;
  --paper-deep:#f0e6d4;
  --ink:#241b12;
  --ink-soft:#5c5044;
  --terracotta:#c8502e;
  --terracotta-deep:#a83e20;
  --peach:#f3dcc8;
  --chalk:#2e2a24;
  --line:#ddd0ba;
  --mustard:#e3a72f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;font-size:17px;line-height:1.55;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.wrap{max-width:1060px;margin:0 auto;padding:0 28px}
a{color:inherit;text-decoration:none}
header{border-bottom:1.5px solid var(--line);background:var(--paper)}
.nav{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:18px}
.brand{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:32px;letter-spacing:-2px;line-height:1;white-space:nowrap}
.brand span{color:#bb5943}
.nav-links{display:flex;gap:26px;font-size:15px;font-weight:500;align-items:center}
.nav-links a{border-bottom:2px solid transparent;padding-top:3px;padding-bottom:2px}@media (hover:hover){.nav-links a:hover{color:var(--terracotta)}}
.pill{background:var(--chalk);color:var(--paper);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}@media (hover:hover){.pill:hover{background:var(--terracotta)}}
main.wrap{flex:1;width:100%}
.kicker{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--terracotta-deep);border:1.5px solid var(--terracotta-deep);border-radius:999px;padding:6px 14px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--terracotta-deep);border:1.5px solid var(--terracotta);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0}
.vacio{padding:64px 0 72px;text-align:center;color:var(--ink-soft)}
.vacio .big{font-family:Fraunces,serif;font-size:30px;font-weight:600;color:var(--ink);margin-bottom:10px}
.hidden{display:none}
footer{padding:34px 0 44px;background:var(--chalk);color:#a99f8d;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid #494236;padding-top:24px}@media (hover:hover){.foot a:hover{color:var(--paper)}}
.foot .links{display:flex;gap:22px}
.foot .links a{display:inline-block;padding:4px 0}
:focus-visible{outline:2px solid var(--terracotta-deep);outline-offset:3px;border-radius:4px}
@media (max-width:760px){
  .nav-links{gap:12px;font-size:14px}
  .brand{font-size:26px}
  .pill{padding:6px 12px;font-size:13px}
  .nav-links a.hide-m{display:none}
  .foot{flex-direction:column;gap:14px;text-align:center}
}

.hero{padding:64px 0 40px;border-bottom:1.5px solid var(--line)}
h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(38px,7vw,60px);line-height:1.06;letter-spacing:-.02em;margin-top:24px}
h1 em{font-style:italic;color:var(--terracotta)}
.hero p.lede{font-size:19px;color:var(--ink-soft);max-width:44ch;margin-top:16px}
.posts{padding:8px 0 72px}
.post{display:grid;grid-template-columns:130px 1fr;gap:8px 26px;padding:26px 6px;border-bottom:1.5px solid var(--line);align-items:baseline}@media (hover:hover){.post:hover{background:var(--paper-deep)}}
.post .fecha{font-size:13.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.post .t{font-family:Fraunces,serif;font-weight:600;font-size:26px;letter-spacing:-.01em;line-height:1.2}@media (hover:hover){.post .t a:hover{color:var(--terracotta)}}
.post .d{font-size:15.5px;color:var(--ink-soft);margin-top:6px;max-width:60ch}
.post .leer{display:inline-block;margin-top:10px;font-size:14px;font-weight:600;color:var(--terracotta-deep)}@media (hover:hover){.post .leer:hover{color:var(--terracotta)}}
.post .tags{margin-top:10px}
@media (max-width:760px){
  .hero{padding:44px 0 30px}
  .post{grid-template-columns:1fr;gap:2px;padding:22px 4px}
  .post .t{font-size:22px}
}

@media (pointer:coarse){
  .brand{display:inline-flex;align-items:center;min-height:44px}
  .nav-links a{display:inline-flex;align-items:center;min-height:44px;padding-top:0;padding-bottom:0}

}

<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="/links/">lucas<span>.</span></a>
    <nav class="nav-links">
      <a href="/profe/#materiales" class="hide-m">Materiales</a>
      <a href="/profe/blog/">Blog</a>
      <a href="https://lucasramos.uy/contacto/?tema=profe" class="hide-m">Contacto</a>
      <a href="https://lucasramos.uy/" class="pill">lucasramos.uy ↗</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <span class="kicker">Blog</span>
    <h1>Notas <em>del profe.</em></h1>
    <p class="lede">Ideas, novedades de los materiales y cosas que voy probando en clase.</p>
  </div>

  <div class="posts" id="posts"></div>

  <div class="vacio hidden" id="vacio">
    <div class="big">Todavía no hay entradas.</div>
    <p>Cuando escriba algo, aparece acá.</p>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <div>© 2026 Lucas · Profe</div>
    <div class="links">
      <a href="https://lucasramos.uy/">lucasramos.uy</a>
      <a href="https://lucasramos.uy/normativa/">Normativa Uruguay</a>
      <a href="https://lucasramos.uy/contacto/?tema=profe">Contacto</a>
    </div>
  </div>
</footer>

<script>

const MESES3 = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
function slug(t){
  return (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function fechaPartes(f){
  const p = (f || '').split('-');
  if (p.length < 3) return null;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  return isNaN(d) ? null : d;
}
function fechaCorta(f){
  const d = fechaPartes(f);
  return d ? d.getDate() + ' ' + MESES3[d.getMonth()] + ' ' + d.getFullYear() : '';
}
function fechaLarga(f){
  const d = fechaPartes(f);
  return d ? d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() : '';
}
function tagsDe(e){
  return (e || '').split(',').map(t => t.trim()).filter(Boolean);
}
function esc(s){
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

fetch('/profe/blog.json', {cache: 'no-store'})
  .then(r => r.ok ? r.json() : {posts: []})
  .then(d => {
    const posts = (Array.isArray(d) ? d : (d.posts || [])).slice()
      .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    if (!posts.length) {
      document.getElementById('vacio').classList.remove('hidden');
      return;
    }
    const cont = document.getElementById('posts');
    for (const p of posts) {
      const s = slug(p.titulo);
      const tags = tagsDe(p.etiquetas);
      const art = document.createElement('article');
      art.className = 'post';
      art.innerHTML =
        '<div class="fecha">' + esc(fechaCorta(p.fecha)) + '</div>' +
        '<div>' +
          '<h2 class="t"><a href="post.html?p=' + encodeURIComponent(s) + '">' + esc(p.titulo) + '</a></h2>' +
          (p.descripcion ? '<p class="d">' + esc(p.descripcion) + '</p>' : '') +
          (tags.length ? '<div class="tags">' + tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' : '') +
          '<a class="leer" href="post.html?p=' + encodeURIComponent(s) + '">Leer →</a>' +
        '</div>';
      cont.appendChild(art);
    }
  })
  .catch(() => { document.getElementById('vacio').classList.remove('hidden'); });
</script>

</body>
