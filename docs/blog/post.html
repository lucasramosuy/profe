<style>
:root{
  --paper:#f7f1e6;
  --paper-deep:#f0e6d4;
  --ink:#241b12;
  --ink-soft:#5c5044;
  --terracotta:#c8502e;
  --terracotta-deep:#a83e20;
  --peach:#f3dcc8;
  --chalk:#2e2a24;
  --line:#ddd0ba;
  --mustard:#e3a72f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;font-size:17px;line-height:1.55;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.wrap{max-width:1060px;margin:0 auto;padding:0 28px}
a{color:inherit;text-decoration:none}
header{border-bottom:1.5px solid var(--line);background:var(--paper)}
.nav{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:18px}
.brand{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:32px;letter-spacing:-2px;line-height:1;white-space:nowrap}
.brand span{color:#bb5943}
.nav-links{display:flex;gap:26px;font-size:15px;font-weight:500;align-items:center}
.nav-links a{border-bottom:2px solid transparent;padding-top:3px;padding-bottom:2px}@media (hover:hover){.nav-links a:hover{color:var(--terracotta)}}
.pill{background:var(--chalk);color:var(--paper);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}@media (hover:hover){.pill:hover{background:var(--terracotta)}}
main.wrap{flex:1;width:100%}
.kicker{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--terracotta-deep);border:1.5px solid var(--terracotta-deep);border-radius:999px;padding:6px 14px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--terracotta-deep);border:1.5px solid var(--terracotta);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0}
.vacio{padding:64px 0 72px;text-align:center;color:var(--ink-soft)}
.vacio .big{font-family:Fraunces,serif;font-size:30px;font-weight:600;color:var(--ink);margin-bottom:10px}
.hidden{display:none}
footer{padding:34px 0 44px;background:var(--chalk);color:#a99f8d;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid #494236;padding-top:24px}@media (hover:hover){.foot a:hover{color:var(--paper)}}
.foot .links{display:flex;gap:22px}
.foot .links a{display:inline-block;padding:4px 0}
:focus-visible{outline:2px solid var(--terracotta-deep);outline-offset:3px;border-radius:4px}
@media (max-width:760px){
  .nav-links{gap:12px;font-size:14px}
  .brand{font-size:26px}
  .pill{padding:6px 12px;font-size:13px}
  .nav-links a.hide-m{display:none}
  .foot{flex-direction:column;gap:14px;text-align:center}
}

.post-head{padding:56px 0 34px;border-bottom:1.5px solid var(--line)}
.volver{display:inline-block;font-size:14.5px;font-weight:500;color:var(--ink-soft);margin-bottom:30px}@media (hover:hover){.volver:hover{color:var(--terracotta)}}
.post-head .kicker{display:table}
h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.02em;margin-top:24px}
h1 em{font-style:italic;color:var(--terracotta)}
.post-head .meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:22px}
.post-head .fecha{font-size:13.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.prose{max-width:66ch;padding:34px 0 76px;font-size:18px;line-height:1.7}
.prose p{margin:0 0 22px}
.prose h2{font-family:Fraunces,serif;font-weight:600;font-size:30px;letter-spacing:-.01em;margin:42px 0 14px}
.prose h3{font-family:Fraunces,serif;font-weight:600;font-size:23px;margin:34px 0 10px}
.prose a{color:var(--terracotta-deep);border-bottom:1.5px solid var(--terracotta)}@media (hover:hover){.prose a:hover{color:var(--terracotta)}}
.prose ul,.prose ol{margin:0 0 22px 22px}
.prose li{margin-bottom:8px}
.prose li::marker{color:var(--terracotta)}
.prose strong{font-weight:700}
.prose em{font-style:italic}
.prose code{background:var(--peach);border-radius:6px;padding:2px 8px;font-size:15px}
.prose blockquote{margin:0 0 22px;padding:14px 20px;border-left:3px solid var(--terracotta);background:var(--paper-deep);font-family:Fraunces,serif;font-style:italic;font-size:19px;color:var(--ink-soft)}
.prose hr{border:0;border-top:1.5px solid var(--line);margin:34px 0}
.prose img{max-width:100%;border-radius:12px;border:1.5px solid var(--line)}
@media (max-width:760px){
  .post-head{padding:38px 0 26px}
  .prose{font-size:17px}
  .prose h2{font-size:25px}
}

@media (pointer:coarse){
  .brand{display:inline-flex;align-items:center;min-height:44px;margin-right:16px}
  .nav-links{gap:20px}
  .nav{padding-top:10px;padding-bottom:10px}
  .nav-links a{display:inline-flex;align-items:center;min-height:44px;padding-top:0;padding-bottom:0}
  .pill{display:inline-flex;align-items:center;min-height:44px}
  .search{min-height:44px}
  .search input{font-size:16px;min-height:44px}
  .foot a,footer a{display:inline-flex;align-items:center;min-height:44px}
}

<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="/profe/">lucas<span>.</span></a>
    <nav class="nav-links">
      <a href="/profe/#materiales" class="hide-m">Materiales</a>
      <a href="/profe/blog/">Blog</a>
      <a href="https://lucasramos.uy/contacto/?tema=profe" class="hide-m">Contacto</a>
    </nav>

</header>

<main class="wrap">
  <div id="art" class="hidden">
    <div class="post-head">
      <a class="volver" href="/profe/blog/">← Volver al blog</a>
      <span class="kicker">Blog</span>
      <h1 id="titulo"></h1>
      <div class="meta">
        <span class="fecha" id="fecha"></span>
        <span id="tags"></span>
      </div>
    </div>
    <div class="prose" id="cuerpo"></div>
  </div>

  <div class="vacio hidden" id="nf">
    <div class="big">Esa entrada no existe.</div>
    <p>Puede que se haya movido o borrado. <a href="/profe/blog/" style="color:var(--terracotta-deep);border-bottom:1.5px solid var(--terracotta)">Volver al blog</a>.</p>

    </div>
  </div>
</footer>

<script>

const MESES3 = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
function slug(t){
  return (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function fechaPartes(f){
  const p = (f || '').split('-');
  if (p.length < 3) return null;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  return isNaN(d) ? null : d;
}
function fechaCorta(f){
  const d = fechaPartes(f);
  return d ? d.getDate() + ' ' + MESES3[d.getMonth()] + ' ' + d.getFullYear() : '';
}
function fechaLarga(f){
  const d = fechaPartes(f);
  return d ? d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() : '';
}
function tagsDe(e){
  return (e || '').split(',').map(t => t.trim()).filter(Boolean);
}
function esc(s){
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function md(src){
  const inline = s => {
    s = esc(s);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, '<img src="$2" alt="$1" loading="lazy">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, '<a href="$2">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  };
  const lines = (src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let para = [], list = null, quote = [];
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push('<' + list.t + '>' + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + '</' + list.t + '>'); list = null; } };
  const flushQuote = () => { if (quote.length) { out.push('<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>'); quote = []; } };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); };
  for (const ln of lines) {
    const l = ln.replace(/\s+$/, '');
    if (!l.trim()) { flushAll(); continue; }
    let m;
    if (m = l.match(/^###\s+(.*)/)) { flushAll(); out.push('<h3>' + inline(m[1]) + '</h3>'); continue; }
    if (m = l.match(/^##?\s+(.*)/)) { flushAll(); out.push('<h2>' + inline(m[1]) + '</h2>'); continue; }
    if (/^(-{3,}|\*{3,})$/.test(l.trim())) { flushAll(); out.push('<hr>'); continue; }
    if (m = l.match(/^>\s?(.*)/)) { flushPara(); flushList(); quote.push(m[1]); continue; }
    if (m = l.match(/^[-*]\s+(.*)/)) { flushPara(); flushQuote(); if (!list || list.t !== 'ul') { flushList(); list = {t: 'ul', items: []}; } list.items.push(m[1]); continue; }
    if (m = l.match(/^\d+[.)]\s+(.*)/)) { flushPara(); flushQuote(); if (!list || list.t !== 'ol') { flushList(); list = {t: 'ol', items: []}; } list.items.push(m[1]); continue; }
    flushList(); flushQuote(); para.push(l.trim());
  }
  flushAll();
  return out.join('\n');
}

const q = new URLSearchParams(location.search).get('p') || '';
fetch('/profe/blog.json', {cache: 'no-store'})
  .then(r => r.ok ? r.json() : {posts: []})
  .then(d => {
    const posts = Array.isArray(d) ? d : (d.posts || []);
    const p = posts.find(x => slug(x.titulo) === q);
    if (!p) {
      document.getElementById('nf').classList.remove('hidden');
      return;
    }
    document.title = (p.titulo || 'Blog') + ' · Profe';
    document.getElementById('titulo').textContent = p.titulo || '';
    document.getElementById('fecha').textContent = fechaLarga(p.fecha);
    const tags = tagsDe(p.etiquetas);
    if (tags.length) document.getElementById('tags').innerHTML = tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('');
    document.getElementById('cuerpo').innerHTML = md(p.cuerpo || '');
    document.getElementById('art').classList.remove('hidden');
  })
  .catch(() => { document.getElementById('nf').classList.remove('hidden'); });
</script>
