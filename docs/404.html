<style>
:root{
  --paper:#f7f1e6;
  --paper-deep:#f0e6d4;
  --ink:#241b12;
  --ink-soft:#5c5044;
  --terracotta:#c8502e;
  --terracotta-deep:#a83e20;
  --peach:#f3dcc8;
  --chalk:#2e2a24;
  --line:#ddd0ba;
  --mustard:#e3a72f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:1060px;margin:0 auto;padding:0 28px}
a{color:inherit;text-decoration:none}

header{border-bottom:1.5px solid var(--line);background:var(--paper)}
.nav{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:18px}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.brand em{font-style:italic;color:var(--terracotta)}
.nav-links{display:flex;gap:26px;font-size:15px;font-weight:500;align-items:center}
.nav-links a{border-bottom:2px solid transparent;padding-top:3px;padding-bottom:2px}
.nav-links a:hover{color:var(--terracotta)}
.pill{background:var(--chalk);color:var(--paper);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.pill:hover{background:var(--terracotta)}

.hero{padding:84px 0 64px;border-bottom:1.5px solid var(--line);position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.25fr .85fr;gap:48px;align-items:end;position:relative;z-index:1}
.kicker{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--terracotta-deep);border:1.5px solid var(--terracotta-deep);border-radius:999px;padding:6px 14px;margin-bottom:26px}
h1{font-family:Fraunces,serif;font-weight:600;font-size:64px;line-height:1.04;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--terracotta)}
.hero p.lede{font-size:19px;color:var(--ink-soft);max-width:38ch}
.squiggle{position:absolute;right:-46px;top:16px;width:170px;opacity:.75}

.search{display:flex;align-items:center;gap:12px;margin:44px 0 8px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 18px}
.search svg{flex:none}
.search input{border:0;outline:0;font:inherit;width:100%;background:transparent;color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#8a7b67}
.search:focus-within{border-color:var(--terracotta-deep);box-shadow:0 0 0 3px var(--peach)}
:focus-visible{outline:2px solid var(--terracotta-deep);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

section.course{padding:38px 0 10px}
.course-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2.5px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
.course-head h2{font-family:Fraunces,serif;font-weight:600;font-size:30px;letter-spacing:-.01em}
.course-head .count{font-size:14px;color:var(--ink-soft)}
.doc{display:flex;align-items:center;gap:18px;padding:18px 6px;border-bottom:1.5px solid var(--line)}
.doc:hover{background:var(--paper-deep)}
.badge{flex:none;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.04em;color:#fff}
.badge.pdf{background:var(--terracotta)}
.badge.doc,.badge.docx{background:#3e6fb0}
.badge.ppt,.badge.pptx{background:var(--mustard);color:var(--ink)}
.badge.otro{background:#8a7c68}
.doc .txt{flex:1;min-width:0}
.doc .t{font-weight:500;font-size:17.5px}
.doc .m{font-size:13.5px;color:var(--ink-soft);margin-top:2px}
.doc .dl{margin-left:auto;flex:none;font-size:14px;font-weight:500;color:var(--terracotta);border:1.5px solid var(--terracotta);border-radius:999px;padding:7px 16px}
.doc .dl:hover{background:var(--terracotta);color:#fff}

.vacio{padding:64px 0 48px;text-align:center;color:var(--ink-soft)}
.vacio .big{font-family:Fraunces,serif;font-size:30px;font-weight:600;color:var(--ink);margin-bottom:10px}
.vacio code{background:var(--peach);border-radius:6px;padding:2px 8px;font-size:14px}

.band{margin:64px 0 0;background:var(--chalk);color:var(--paper);padding:56px 0}
.band-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center}
.band h2{font-family:Fraunces,serif;font-weight:600;font-size:34px;letter-spacing:-.01em;margin-bottom:14px}
.band h2 em{font-style:italic;color:var(--mustard)}
.band p{color:#cfc6b8;max-width:52ch}
.btn{display:inline-block;margin-top:24px;background:var(--terracotta-deep);color:#fff;font-weight:600;font-size:15px;border-radius:999px;padding:12px 26px}
.btn:hover{background:var(--terracotta-deep)}

footer{padding:34px 0 44px;background:var(--chalk);color:#a99f8d;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid #494236;padding-top:24px}
.foot a:hover{color:var(--paper)}
.foot .links{display:flex;gap:22px}
.foot .links a{display:inline-block;padding:4px 0}

.hidden{display:none}

@media (max-width:760px){
  h1{font-size:42px}
  .hero{padding:56px 0 44px}
  .hero-grid,.band-grid{grid-template-columns:1fr;gap:24px}
  .squiggle{width:100px;top:-14px;right:-16px;opacity:.5}
  .nav-links{gap:12px;font-size:14px}
  .brand{font-size:20px}
  .pill{padding:6px 12px;font-size:13px}
  .nav-links a.hide-m{display:none}
  .course-head{flex-direction:column;align-items:flex-start;gap:2px}
  .doc{gap:12px;flex-wrap:wrap}
  .doc .dl{flex-basis:100%;margin-left:0;text-align:center;padding:9px 12px;font-size:14px}
  .foot{flex-direction:column;gap:14px;text-align:center}
}
</style>
</head>
