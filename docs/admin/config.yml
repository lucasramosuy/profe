backend:
  name: github
  repo: lucasramosuy/profe
  branch: prod
  # Login solo con token de GitHub (PAT con permiso Contents sobre este repo).
  # El botón OAuth "Sign In with GitHub" pasa por Netlify, por eso se apaga.
  auth_methods: [token]
app_title: Profe. Lucas
logo_url: /profe/logo-profe.svg
site_url: https://lucasramos.uy/profe/
media_folder: docs/archivos
public_folder: archivos
collections:
  - name: contenido
    label: Contenido
    files:
      - name: materiales
        label: Materiales
        file: docs/materiales.json
        fields:
          - label: Materiales
            name: materiales
            label_singular: Material
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - {label: Título, name: titulo, widget: string}
              - {label: Curso, name: curso, widget: string, hint: "Ej.: Derecho, Formación docente"}
              - {label: Descripción, name: descripcion, widget: string, required: false}
              - {label: Archivo, name: archivo, widget: file}
              - label: Fecha
                name: fecha
                widget: datetime
                time_format: false
                date_format: YYYY-MM-DD
                format: YYYY-MM-DD
